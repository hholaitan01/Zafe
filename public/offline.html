<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · TrustFlow</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #F8FAFC; color: #0F172A; text-align: center; padding: 24px;
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 340px; }
    .mark { width: 60px; height: 60px; margin: 0 auto 22px; border-radius: 16px; background: #0F172A; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    p { margin: 12px 0 24px; font-size: 15px; line-height: 1.55; color: #64748B; }
    button {
      height: 48px; padding: 0 22px; border: none; border-radius: 12px; background: #059669; color: #fff;
      font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 2.5 27 7v8.5c0 7-4.6 11.6-11 13.5-6.4-1.9-11-6.5-11-13.5V7z" fill="#10B981" />
        <path d="M11 16.2 14.6 20 21.5 12.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>TrustFlow needs a connection to load your deals and move money safely. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
